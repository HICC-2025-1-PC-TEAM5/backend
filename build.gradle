plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'hicc-project'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

// Spring Boot 3.4가 관리하는 Testcontainers 1.20.x는 Docker Engine 29(최소 API 1.40)에 연결하지 못한다(400). 수정된 버전으로 올린다 (D-023)
ext['testcontainers.version'] = '1.21.4'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.google.cloud:google-cloud-vision:3.65.0'
	implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
	implementation 'org.json:json:20230227'
	// 레시피 CSV 스냅샷 읽기 (D-020). 재료 칸 안의 줄바꿈·쉼표를 처리한다
	implementation 'org.apache.commons:commons-csv:1.12.0'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	compileOnly 'org.projectlombok:lombok'
	// protobuf는 X DevAPI(mysqlx)에서만 쓴다. JDBC만 쓰므로 제외해 Vision이 쓰는 protobuf 3.x를 덮어쓰지 않게 한다 (B21)
	runtimeOnly('com.mysql:mysql-connector-j') {
		exclude group: 'com.google.protobuf', module: 'protobuf-java'
	}
	annotationProcessor 'org.projectlombok:lombok'
	// 스키마 변경은 Flyway 마이그레이션으로 관리한다 (D-023). 파일: src/main/resources/db/migration
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// DB 테스트는 실제 MySQL 컨테이너로 한다 (D-023). Docker가 없으면 해당 테스트는 건너뛴다
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.google.api-client:google-api-client:2.2.0'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
}

tasks.named('test') {
	useJUnitPlatform()
}
