# 모든 실행 환경에 공통인 설정 (비밀값 아님, git에 커밋한다. D-032)
# 비밀값(DB 비밀번호, 키 …)은 git 제외 파일 src/main/resources/application.properties에 둔다.
# Spring Boot는 classpath:/config/를 classpath 루트보다 나중에 읽으므로 같은 키는 이 파일 값이 쓰인다.
# 도커는 docker-compose.yml 환경변수로 같은 값을 한 번 더 넣는다(마운트한 로컬 파일보다 우선하도록).

# 스키마는 Flyway가 만들고(db/migration), Hibernate는 엔티티와 맞는지만 확인한다 (D-023)
spring.jpa.hibernate.ddl-auto=validate
# 테이블은 있는데 Flyway 이력이 없는 기존 DB는 V1(기준 스키마)을 적용된 것으로 보고 V2부터 실행한다
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# 연관 엔티티·컬렉션을 행마다 따로 조회하지 않고 IN으로 묶어 조회한다(N+1 완화). 기록·취향·알레르기·냉장고 목록이
# 행마다 레시피·재료를 조회하던 것을 줄인다 (성능 점검 2026-10-09, P-014)
spring.jpa.properties.hibernate.default_batch_fetch_size=100
