# 로컬 개발용: Spring Boot + MySQL
# 사용법: .env.example을 .env로 복사해 값을 채운 뒤 `docker compose up --build`
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    # 가정 배포 사양: RDS db.t3.micro (2 vCPU, 1GiB) — D-009
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # application.properties의 DB 설정을 덮어쓴다 (컨테이너 안에서는 localhost가 아니라 서비스 이름 mysql)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/google-vision.json
      TZ: Asia/Seoul
    volumes:
      - ./src/main/resources/application.properties:/app/config/application.properties:ro
      - ./secrets:/app/secrets:ro
    ports:
      - "${APP_PORT:-8080}:8080"
    # 가정 배포 사양: EC2 t3.micro (2 vCPU, 1GiB) — D-009
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

volumes:
  mysql-data:
